<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
  <title>opendisplay-win: a PC monitor and an iPad sharing one Windows desktop</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f8fd"/><stop offset="1" stop-color="#dbe9f7"/></linearGradient>
    <radialGradient id="wall" gradientUnits="userSpaceOnUse" cx="200" cy="260" r="300"><stop offset="0" stop-color="#9fdcff"/><stop offset="0.45" stop-color="#3a96dd"/><stop offset="1" stop-color="#0f4c97"/></radialGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4048"/><stop offset="1" stop-color="#22262c"/></linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9b3be"/><stop offset="1" stop-color="#7d8792"/></linearGradient>
    <clipPath id="screens"><rect x="58" y="124" width="256" height="168" rx="8"/><rect x="352" y="166" width="116" height="172" rx="12"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b2a4a" flood-opacity="0.25"/></filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#plate)"/>
  <g transform="translate(0 17)">
  <g filter="url(#sh)">
    <rect x="168" y="306" width="36" height="48" fill="url(#stand)"/>
    <rect x="114" y="348" width="144" height="18" rx="9" fill="url(#stand)"/>
    <rect x="46" y="112" width="280" height="192" rx="16" fill="url(#bezel)"/>
    <rect x="340" y="154" width="140" height="196" rx="22" fill="url(#bezel)"/>
  </g>
  <rect x="58" y="124" width="256" height="168" rx="8" fill="url(#wall)"/>
  <rect x="352" y="166" width="116" height="172" rx="12" fill="url(#wall)"/>
  <!-- one window across both screens -->
  <g clip-path="url(#screens)">
    <rect x="238" y="168" width="176" height="96" rx="8" fill="#fff" fill-opacity="0.95"/>
    <rect x="238" y="168" width="176" height="18" rx="8" fill="#e6eef7"/>
    <rect x="252" y="198" width="92" height="9" rx="4.5" fill="#c7d6e6"/>
    <rect x="252" y="216" width="140" height="9" rx="4.5" fill="#c7d6e6"/>
    <rect x="252" y="234" width="116" height="9" rx="4.5" fill="#c7d6e6"/>
  </g>
  <!-- taskbar with centered icons -->
  <rect x="58" y="270" width="256" height="22" fill="#ffffff" fill-opacity="0.82"/>
  <rect x="142" y="274" width="14" height="14" rx="3" fill="#0f6cbd"/>
  <rect x="160" y="274" width="14" height="14" rx="3" fill="#ffb900"/>
  <rect x="178" y="274" width="14" height="14" rx="3" fill="#4cc2ff"/>
  <rect x="196" y="274" width="14" height="14" rx="3" fill="#8a8f98"/>
  </g>
</svg>
